                <div class="tk-view" id="toolkit-effects-view">

                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />

                                <line x1="9" y1="15" x2="15" y2="15" />
                            </svg></button>
                        <button type="button" class="tk-effects-history-btn" id="btn-tk-bulk-delete-toggle"

                            style="width: auto !important; padding: 0 6px !important; gap: 2.5px !important;">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6" />

                            </svg>
                            <span id="tk-delete-count"
                                style="display: none; font-size: 8px; font-weight: 700; line-height: 1;">(0)</span>

                    </div>

                    <!-- Compact Horizontal Category Navigation Bar -->
                    <div class="tk-category-bar-wrap">
                        <div class="tk-category-left">
