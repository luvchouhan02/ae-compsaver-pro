            <div id="templates-module">

                                <path
                                    d="M18 3a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3H6a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3V6a3 3 0 0 0-3-3-3 3 0 0 0-3 3 3 3 0 0 0 3 3h12a3 3 0 0 0 3-3 3 3 0 0 0-3-3z" />
                            </svg>
                            <span class="switcher-label">ICON</span>

                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                <circle cx="8.5" cy="8.5" r="1.5" />
                                <polyline points="21 15 16 10 5 21" />
                            </svg>
                            <span class="switcher-label">IMG</span>

                                <path d="M2 12l10 5 10-5" />

                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="4 7 4 4 20 4 20 7" />
                                <line x1="9" y1="20" x2="15" y2="20" />
                                <line x1="12" y1="4" x2="12" y2="20" />
                            </svg>
                            <span class="switcher-label">TEXT</span>
                        </button>

                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="23 7 16 12 23 17 23 7" />
                                <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />

                            </svg>
                            <span class="switcher-label">FX</span>
                        </button>

                             Hidden until the JS relocation helper moves an overflowing button here. -->
                        <details class="switcher-overflow">

                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                                    <polyline points="6 9 12 15 18 9" />
                                </svg>
                                <span class="switcher-label">MORE</span>
                            </summary>
                            <div class="switcher-overflow__body"></div>
                        </details>
                    </div>

                    <div class="tabs-wrapper">
                        <div id="category-tabs" class="tabs-area">
                            <button class="cat-pill active" data-cat="All">All</button>

                        </div>
                        <button id="btn-more-cats" class="icon-btn" title="Categories">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round">
                                <line x1="8" y1="6" x2="21" y2="6" />

                                <line x1="3" y1="18" x2="3.01" y2="18" />
                            </svg>
                        </button>
                        <button id="btn-tmp-bulk-toggle" class="icon-btn icon-btn--danger" title="Bulk Delete"

                                <path

                        <button id="btn-refresh-templates" class="icon-btn" title="Refresh"

                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10" />

                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                            </svg>

                        <button id="btn-import-file" class="icon-btn media-import-btn" title="Import File"
                            style="display: none; margin-left: 4px;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

                                <line x1="12" y1="18" x2="12" y2="12"></line>
                                <line x1="9" y1="15" x2="15" y2="15"></line>
                            </svg>
                        </button>
                        <button id="btn-import-folder" class="icon-btn media-import-btn" title="Import Folder"
                            style="display: none; margin-left: 2px;">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                                </path>
                                <line x1="12" y1="11" x2="12" y2="17"></line>
                                <line x1="9" y1="14" x2="15" y2="14"></line>
                            </svg>
                        </button>
                        <div id="cat-panel" class="cat-panel">
                            <div class="cat-panel-header">
                                <span>Categories</span>
                                <button id="btn-close-cats">&#10005;</button>
                            </div>
                            <div class="cat-panel-toggle-row">
                                <label class="toggle-container">
                                    <input type="checkbox" id="chk-show-all-cats">
                                    <span class="toggle-label">Show All Inline</span>
                                </label>
                            </div>
                            <div id="cat-panel-list" class="cat-panel-list">
                            </div>
                        </div>
                    </div>
                </div>
                <!-- /.tpl-toolbar -->

                <div class="ta-bulk-confirm" id="tmp-bulk-confirm">
                    <span class="ta-bulk-warning">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />

                            <line x1="12" y1="17" x2="12.01" y2="17" />

                        Delete selected compositions and assets from disk?

                    <div class="ta-bulk-actions">
                        <button type="button" class="ta-confirm-btn" id="btn-tmp-bulk-confirm">Confirm</button>
                        <button type="button" class="ta-cancel-btn" id="btn-tmp-bulk-cancel">Cancel</button>

                <div id="section-text" class="section-content" style="display:none;">
                    <div id="text-list-container" class="grid-container"></div>
                </div>
                <div id="section-footage" class="section-content" style="display:none;">
                    <div id="footage-list-container" class="grid-container"></div>
                </div>
                <div id="section-effect" class="section-content" style="display:none;">

                        <span id="save-btn-text">Save Template</span>
                    </button>

            </div>
